<html lang="ar" class="text-right">

<head>
    <title></title>

    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <link href="bootstrap.css" rel="stylesheet" type="text/css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-rtl/3.4.0/css/bootstrap-rtl.css" rel="stylesheet" type="text/css"
    />
</head>

<body>
    <div class="container" lang="ar" dir="rtl">
        <h2>نموذج مقترح بحثي</h2>
        <div class="row">
            <div class="col-md-6">
                <div class="form-group" class="text-right">
                    <label class="control-label col-sm-4">كود الوحدة البحثية </label> </td>
                    <div class="col-md-8">
                        <input class="form-control" id="Name" name="Name" type="text" value="" />
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label class="control-label col-sm-4 "> اسم المشروع</label>
                    <div class="col-md-8">
                        <input class="form-control" id="Name" name="Name" type="text" value="" />
                    </div>
                </div>
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label class="control-label col-sm-4"> السنة</label>
                    <div class="col-md-8">
                        <input class="form-control" id="Name" name="Name" type="text" value="" />
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label class="control-label col-sm-4 "> عنوان المشروع المقترح باللغة العربية </label>
                    <div class="col-md-8">
                        <input class="form-control" id="Name" name="Name" type="text" value="" />
                    </div>
                </div>
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">

                    <label class="control-label col-sm-4">عنوان المشروع المقترح باللغة الانجليزية</label>
                    <div class="col-md-8">
                        <input class="form-control" id="Name" name="Name" type="text" value="" />
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label class="control-label col-sm-4 ">الميزانية المقترحة</label>
                    <div class="col-md-8">
                        <input class="form-control" id="Name" name="Name" type="text" value="" />
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">

                    <label class="control-label col-sm-4">المدة المقترحة </label>
                    <div class="col-md-8">
                        <input class="form-control" id="Name" name="Name" type="text" value="" />
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label class="control-label col-sm-4 ">نوع مشروع اليحث</label>
                    <form>
                        <div class="radio">
                            <label><input type="radio" name="optradio"> مفرد </label>
                        </div>
                        <div class="radio">
                            <label><input type="radio" name="optradio">  مشترك </label>
                        </div>
                    </form>

                </div>
            </div>
            <tr>
                <div class="row">
                    <div class="col-md-12">
                        <table class="table table-bordered">
                            <tr>
                                <td>الباحث الرئيس</td>
                                <td><input type="text" class="form-control" /></td>
                            </tr>
                            <tr>
                                <td> الباحث المشارك الأول </td>
                                <td><input type="text" class="form-control" /></td>
                            </tr>
                            <tr>
                                <td> الباحث المشارك الثاني </td>
                                <td><input type="text" class="form-control" /></td>
                            </tr>
                        </table>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">

                            <label class="control-label col-sm-4">    رئيس وحدة/مراكز البحوث </label>
                            <div class="col-md-8">
                                <input class="form-control" id="Name" name="Name" type="text" value="" />
                            </div>
                            <label class="control-label col-sm-4">  بكلية/معهد </label>
                            <div class="col-md-8">
                                <input class="form-control" id="Name" name="Name" type="text" value="" />
                            </div>
                            <label class="control-label col-sm-4">   الاسم </label>
                            <div class="col-md-8">
                                <input class="form-control" id="Name" name="Name" type="text" value="" />
                            </div>
                            <label class="control-label col-sm-4">    التوقيع </label>
                            <div class="col-md-8">
                                <input class="form-control" id="Name" name="Name" type="text" value="" />
                            </div>
                            <label class="control-label col-sm-4">    التاريخ </label>
                            <div class="col-md-8">
                                <input class="form-control" id="Name" name="Name" type="date" value="" />
                            </div>



                            <form>
                                <div class="form-group">
                                    <label for="name">أبرز ايجابيات المشروع</label>
                                    <textarea class="form-control" rows="5" id="name"></textarea>
                                </div>
                            </form>
                            <form>
                                <div class="form-group">
                                    <label for="name">أبرز سلبيات المشروع</label>
                                    <textarea class="form-control" rows="5" id="name"></textarea>
                                </div>
                            </form>
                            <form>
                                <div class="form-group">
                                    <label for="name">    التوصية   </label>
                                    <form>
                                        <div class="radio">
                                            <label><input type="radio" name="optradio">المشروع صالح للتمويل بصورته الحالية</label>
                                        </div>
                                        <div class="radio">
                                            <label><input type="radio" name="optradio">  صالح للتمويل بعد العمل في الملحوظات الواردة في التقرير  </label>
                                        </div>
                                        <div class="radio disabled">
                                            <label><input type="radio" name="optradio" disabled>  (غير صالح للتمويل إطلاقاً (اذكر من فضلك المبررات التي جعلت المشروع غير جدير بالتمويل   </label>
                                        </div>
                                    </form>




                                </div>



</body>

</html>
