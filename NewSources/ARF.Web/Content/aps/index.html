<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <title></title>

    <!-- Bootstrap -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body>
    <nav class="navbar navbar-default">
        <div class="whiteborder">
            <div class="container">
                <!-- Brand and toggle get grouped for better mobile display -->
                <div class="navbar-header">
                    <button type="button" class="navbar-toggle collapsed" data-toggle="collapse"
                            data-target="#bs-example-navbar-collapse-1" aria-expanded="false">
                        <span class="sr-only">Toggle navigation</span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                    </button>
                    <a class="navbar-brand" href="https://imamu.edu.sa"><img alt="Brand" class="img-responsive" src="imgs/header-logo.png"></a>
                    <a class="navbar-brand" href="https://imamu.edu.sa"><img alt="Brand" class="img-responsive" src="imgs/header-logo-2-2.png"></a>

                </div>

                <!-- Collect the nav links, forms, and other content for toggling -->
                <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">

                    <ul class="nav navbar-nav navbar-right social">
                        <li><a href="#"><i class="fa fa-linkedin" aria-hidden="true"></i></a></li>
                        <li><a href="#"><i class="fa fa-twitter" aria-hidden="true"></i></a></li>
                        <li><a href="#"><i class="fa fa-facebook" aria-hidden="true"></i></a></li>

                    </ul>
                </div><!-- /.navbar-collapse -->
            </div><!-- /.container-fluid -->
        </div>
    </nav>

    <div class="container">


        <footer class="partner-div text-center">
            Copyright &copy; 2017 Kay Technology
        </footer>

    </div>


    <!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js" nonce="@Html.ScriptNonce()"></script>
    <!-- Include all compiled plugins (below), or include individual files as needed -->
    <script src="js/bootstrap.min.js" nonce="@Html.ScriptNonce()"></script>
    <script src="slick/slick.min.js" nonce="@Html.ScriptNonce()"></script>
    <script nonce="@Html.ScriptNonce()">
        $(document).ready(function () {
            $('.slick-slider').slick({
                infinite: true,
                speed: 300,
                autoPlay: true,
                autoplaySpeed: 2000,
                slidesToShow: 3,
                variableWidth: true,
                responsive: [
                    {
                        breakpoint: 1024,
                        settings: {
                            slidesToShow: 3,
                            infinite: true
                        }
                    },
                    {
                        breakpoint: 600,
                        settings: {
                            slidesToShow: 2,
                            slidesToScroll: 2
                        }
                    },
                    {
                        breakpoint: 480,
                        settings: {
                            slidesToShow: 1,
                            slidesToScroll: 1
                        }
                    }]
            });

            $('.telescope').popover({
                content: '<div class="popup">أن يصبح أقوى معرض تنافسي لمشاريع التخرج في المملكة العربية السعودية </div>',
                html: true,
                placement: "bottom"
            });

            $('.bulb').popover({
                content: '<div class="popup"><ul><li>خلق الوعي بأهمية مشاريع التخرج ودورها في تحقيق رؤية 2030</li><li>ايرار دور الكلية في مجال تملية المجتمع من خلال الأمكار والمشاريع النوعية</li><li>التكامل بين الجامعة والقطاع الخاص، وخلق الفرص والمبادرات التكاملية</li><li>توعية الطلبة بنوعية المشاريع التي تواكب حاجة المجتمع</li></ul> <div class="text-center"></div>  </div>',
                html: true,
                placement: "bottom"
            });

            $('.trophy').popover({
                content: '<div class="popup"><ul><li>جائزة (انتل) لـ أفضل مشروع تخرج </li><li>جائزة (كيه) لأفضل بوستر Poster </li><li>جائزة (كيه) لأفضل تفاعل </li></ul> <div class="text-center"></div>  </div>',
                html: true,
                placement: "bottom"
            });


            $(document).on('click', function (e) {
                $('[data-toggle="popover"],[data-original-title], .telescope').each(function () {
                    //the 'is' for buttons that trigger popups
                    //the 'has' for icons within a button that triggers a popup
                    if (!$(this).is(e.target) && $(this).has(e.target).length === 0 && $('.popover').has(e.target).length === 0) {
                        (($(this).popover('hide').data('bs.popover') || {}).inState || {}).click = false  // fix for BS 3.3.6
                    }
                });
                $('[data-toggle="popover"],[data-original-title], .bulb').each(function () {
                    //the 'is' for buttons that trigger popups
                    //the 'has' for icons within a button that triggers a popup
                    if (!$(this).is(e.target) && $(this).has(e.target).length === 0 && $('.popover').has(e.target).length === 0) {
                        (($(this).popover('hide').data('bs.popover') || {}).inState || {}).click = false  // fix for BS 3.3.6
                    }
                });
                $('[data-toggle="popover"],[data-original-title], .trophy').each(function () {
                    //the 'is' for buttons that trigger popups
                    //the 'has' for icons within a button that triggers a popup
                    if (!$(this).is(e.target) && $(this).has(e.target).length === 0 && $('.popover').has(e.target).length === 0) {
                        (($(this).popover('hide').data('bs.popover') || {}).inState || {}).click = false  // fix for BS 3.3.6
                    }
                });
                $('[data-toggle="popover"],[data-original-title], .jigsaw').each(function () {
                    //the 'is' for buttons that trigger popups
                    //the 'has' for icons within a button that triggers a popup
                    if (!$(this).is(e.target) && $(this).has(e.target).length === 0 && $('.popover').has(e.target).length === 0) {
                        (($(this).popover('hide').data('bs.popover') || {}).inState || {}).click = false  // fix for BS 3.3.6
                    }
                });

            });
        });
    </script>
</body>
</html>
